[project]
name = "inline-dialogue-mcp"
version = "0.1.0"
description = "MCP server for managing AUTHOR/AGENT code review threads"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
inline-dialogue-mcp = "inline_dialogue_mcp.server:mcp.run"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
