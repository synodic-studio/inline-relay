[project]
name = "inline-relay-mcp"
version = "0.1.4"
description = "AUTHOR/AGENT inline code review threads - CLI and edit guards"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
inline-relay = "inline_relay_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
